<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>100 Days</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f1ee;--ink:#141414;--mut:#7a7a74;--tile:#fff;--ln:#e6e6e1;--lime:#c8f169;--lime2:#e9f7c4;--red:#d93025;--rs:#ffe6e2;--r:26px}
*{box-sizing:border-box;margin:0}
body{font-family:'IBM Plex Sans Arabic','IBM Plex Sans',sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;padding:16px;max-width:1180px;margin:auto}
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.tile{background:var(--tile);border:1px solid var(--ln);border-radius:var(--r);padding:22px;min-width:0}
.hero{grid-column:span 12}.days{grid-column:span 8}.pomo{grid-column:span 4;background:var(--ink);color:#fff;border-color:var(--ink)}
.today{grid-column:span 7}.danger{grid-column:span 5;background:var(--rs);border-color:#f6c9c3}
.prog{grid-column:span 5}.manage{grid-column:span 7}.vision{grid-column:span 12}.navw{grid-column:span 12}
h1{font-size:clamp(2.4rem,8vw,4.2rem);font-weight:700;letter-spacing:-2px;line-height:1}
h2{font-size:1.05rem;font-weight:600;margin-bottom:14px;color:var(--mut)}
.pomo h2{color:#a9a9a2}.danger h2{color:var(--red)}
h3{font-size:1.05rem;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button,input,textarea,select{font:inherit;color:inherit;border:1px solid var(--ln);background:#fff;padding:9px 14px;border-radius:14px}
button{cursor:pointer;font-weight:600;transition:transform .15s,background .15s}
button:hover{background:#f4f4f0}button:active{transform:scale(.97)}
button.p{background:var(--ink);color:#fff;border-color:var(--ink)}button.p:hover{background:#333}
button.k{background:var(--lime);border-color:var(--lime)}button.d{color:var(--red)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
textarea,input[type=text]{width:100%}textarea{min-height:64px;resize:vertical}
.mono{font-family:'IBM Plex Mono',monospace}
.bar{height:12px;border-radius:99px;background:#ecece7;position:relative;margin:8px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .4s}
.bar b{display:none}
.bl{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.blk{aspect-ratio:1;border:1px solid var(--ln);border-radius:10px;font-size:.72rem;padding:0;display:flex;align-items:center;justify-content:center;background:#f7f7f4;color:var(--mut)}
.blk.f{background:var(--lime);border-color:var(--lime);color:var(--ink)}.blk.h{background:var(--lime2);border-color:var(--lime2);color:var(--ink)}.blk.m{background:var(--rs);border-color:#f6c9c3;color:var(--red)}
.blk.t{box-shadow:0 0 0 2px var(--ink)}.blk.s{background:var(--ink);border-color:var(--ink);color:#fff}.blk.l{opacity:.5}
.grp{border:1px solid var(--ln);border-radius:18px;padding:14px;margin-bottom:12px;background:#fafaf8}
.gh{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:8px}
.chk{display:flex;gap:12px;align-items:center;padding:10px 12px;margin:6px 0;border-radius:12px;cursor:pointer;background:#fff;border:1px solid var(--ln)}
.chk.on{background:var(--lime2);border-color:var(--lime);text-decoration:line-through;text-decoration-color:#0006}
.chk input{width:20px;height:20px;accent-color:var(--ink);padding:0}
.tag{border-radius:99px;padding:2px 10px;font-size:.8rem;background:#f1f1ee}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{border:1px solid var(--ln);border-radius:22px;overflow:hidden;background:#fafaf8}
.card .img{aspect-ratio:4/3;background:#ecece7;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;color:var(--mut);font-weight:600}
.card .img img{width:100%;height:100%;object-fit:cover}
.card .in{padding:14px}.card h3{margin-bottom:6px}
.q{font-weight:600;font-size:.88rem;margin:8px 0 6px;color:var(--mut)}
.dg{background:#fff;border-radius:16px;padding:12px 14px;margin:8px 0;font-size:.95rem}.dg b{color:var(--red)}
.clock{font-family:'IBM Plex Mono',monospace;font-size:clamp(2.8rem,7vw,4.6rem);font-weight:700;line-height:1;color:var(--lime);margin:6px 0 16px}
.pomo button{background:#2a2a2a;border-color:#3a3a3a;color:#fff}.pomo button.p{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.pomo input{background:#2a2a2a;border-color:#3a3a3a;color:#fff}.pomo .tag{background:#2a2a2a;color:#d8d8d0}
.icons{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.icons button{font-size:1.3rem;padding:4px 8px;border-radius:12px}.icons button.sel{background:var(--lime);border-color:var(--lime)}
dialog{border:none;border-radius:26px;padding:24px;width:min(520px,94vw);margin:auto;box-shadow:0 20px 60px #0004}dialog::backdrop{background:#0008}
label{font-weight:600;display:block;margin-top:12px;font-size:.9rem}
nav{display:flex;flex-wrap:wrap;gap:8px}nav a{border-radius:99px;background:#fff;border:1px solid var(--ln);color:var(--ink);padding:6px 16px;font-weight:600;font-size:.9rem;text-decoration:none}nav a:hover{background:var(--lime)}
.empty{border:1px dashed #c9c9c2;border-radius:16px;padding:14px;color:var(--mut)}
@media(max-width:860px){.days,.pomo,.today,.danger,.prog,.manage,.vision{grid-column:span 12}.tile{padding:18px}}
@media(max-width:520px){.grid{gap:4px}.blk{font-size:.62rem;border-radius:8px}body{padding:10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.stats{grid-column:span 12}.week{grid-column:span 5}.note{grid-column:span 7}
.sg{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.sx{background:var(--bg);border-radius:18px;padding:14px}.sv{font-size:1.7rem;font-weight:700;line-height:1.1}.sl{font-size:.82rem;color:var(--mut);margin-top:4px}
.bdg{border:1px solid var(--ln);border-radius:99px;padding:4px 12px;font-size:.85rem;color:var(--mut)}.bdg.on{background:var(--lime);color:#111;border-color:var(--lime)}
.wk{display:flex;gap:8px;align-items:flex-end;height:150px}.wc{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;text-align:center}
.wb{background:var(--lime);border-radius:8px 8px 4px 4px;min-height:4px;transition:height .4s}.wc small{color:var(--mut);margin-top:4px}
.nudge{background:var(--lime2);border-radius:14px;padding:10px 14px;margin:12px 0;font-size:.9rem}
.pomo select{background:#2a2a2a;border-color:#3a3a3a;color:#fff}.pomo .tag{display:inline-block}
.blk:disabled{cursor:not-allowed}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--tile);padding:10px 20px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9;max-width:90vw;text-align:center}#toast.on{opacity:1}
[data-theme=dark]{--bg:#0e0e0d;--ink:#f1f1ec;--mut:#98988f;--tile:#1a1a18;--ln:#2d2d2a;--lime2:#2c3713;--rs:#3a1d19}
[data-theme=dark] button,[data-theme=dark] input,[data-theme=dark] textarea,[data-theme=dark] select,[data-theme=dark] .chk,[data-theme=dark] .dg,[data-theme=dark] nav a{background:#232321}
[data-theme=dark] .grp,[data-theme=dark] .card,[data-theme=dark] .blk{background:#202020}
[data-theme=dark] .bar,[data-theme=dark] .tag,[data-theme=dark] .card .img{background:#2a2a27}
[data-theme=dark] button.p,[data-theme=dark] .blk.s{color:#111}[data-theme=dark] button:hover{background:#2c2c29}
[data-theme=dark] .blk.f{background:var(--lime);color:#111}[data-theme=dark] .blk.h{background:var(--lime2);color:var(--ink)}[data-theme=dark] .blk.m{background:var(--rs);color:#ff8a7d}
[data-theme=dark] .chk.on{background:var(--lime2)}[data-theme=dark] .pomo{background:#000;border-color:#2d2d2a}
[data-theme=dark] .danger{border-color:#5a2a24}[data-theme=dark] .dg b,[data-theme=dark] .danger h2{color:#ff8a7d}
[data-theme=dark] .bar i{background:var(--lime)}[data-theme=dark] dialog{background:#1a1a18;color:var(--ink)}[data-theme=dark] .sx{background:#232321}
@media(max-width:860px){.stats,.week,.note{grid-column:span 12}.sg{grid-template-columns:repeat(3,1fr)}}
.dc{padding:2px 8px;border-radius:8px;font-size:.78rem;margin:0 1px}.dc.on,.kb.on{background:var(--ink);color:var(--tile);border-color:var(--ink)}
.dy{display:inline-flex;flex-wrap:wrap}
.share{grid-column:span 8}.rem{grid-column:span 4}
#cv{max-height:560px;max-width:100%;width:auto;height:auto;border-radius:18px;border:1px solid var(--ln)}
@media(max-width:860px){.share,.rem{grid-column:span 12}}
.wh{display:block;color:var(--mut);font-size:.8rem;font-weight:400}
.mb{padding:2px 10px;border-radius:99px;font-size:.78rem}
.chk.mini{background:#fff3b0;border-color:#f0dd70}[data-theme=dark] .chk.mini{background:#3a3414}
.mt{margin-top:8px;padding:10px 12px;border:1px solid var(--ln);border-radius:14px}
.nudge.warn{background:var(--rs);color:var(--red);font-weight:600}.nudge a{color:inherit;font-weight:600}
.review{grid-column:span 7}.rewards{grid-column:span 5}
.final{grid-column:span 12;background:var(--lime);color:#111;border-color:var(--lime)}.final h2{color:#111}.final button{color:#111}
@media(max-width:860px){.review,.rewards{grid-column:span 12}}
.qt{border-inline-start:4px solid var(--ink);padding:8px 14px;margin-bottom:12px;font-weight:600}
.blk.z{background:#d6ecff;border-color:#b6d9f5;color:#1d5f94}[data-theme=dark] .blk.z{background:#12304a;border-color:#1d4a70;color:#8cc8f5}
.heat{grid-column:span 12}.hmw{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.hm{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;margin-top:6px}.hm i{aspect-ratio:1;border-radius:3px;display:block;background:var(--ln)}
.hm .hf{background:var(--lime)}.hm .hm2{background:#e6d96a}.hm .hx{background:#f3a79f}.hm .hr{background:transparent;border:1px dashed var(--ln)}.hm .hl{background:var(--bg)}
#toast.act{pointer-events:auto}#toast button{margin-inline-start:10px;padding:2px 12px;color:var(--ink)}
@media(max-width:860px){.heat{grid-column:span 12}}
</style>
</head>
<body>
<main class="bento">
<header class="tile hero">
 <div class="row" style="justify-content:space-between">
  <h1 id="ttl"></h1>
  <div class="row"><button onclick="toggleTheme()" id="th" aria-label="Theme"></button><button class="k" onclick="setLang()" id="lg"></button></div>
 </div>
 <p id="sub" style="color:var(--mut);margin:10px 0 16px"></p>
 <div class="row">
  <label style="margin:0" id="lstart"></label><input type="date" id="start" onchange="setStart(this.value)">
  <span class="mono" id="dn"></span>
 </div>
 <div id="nudge"></div><div id="overall" style="margin:14px 0"></div>
 <div class="row">
  <button onclick="exp()" id="bexp"></button>
  <button onclick="document.getElementById('imp').click()" id="bimp"></button>
  <button id="bauto" onclick="autoPick()" hidden></button><button class="d" onclick="resetAll()" id="brst"></button>
  <input type="file" id="imp" accept="application/json" hidden onchange="imp(this)">
 </div>
</header>
<nav id="nav" class="navw"></nav>
<section class="tile final" id="s-final" hidden></section>
<section class="tile stats" id="s-stats"><h2 id="h-stats"></h2><div class="sg" id="stats"></div><div class="row" id="badges" style="margin-top:14px"></div><div id="insights" style="margin-top:14px;font-size:.9rem;display:grid;gap:4px"></div></section>
<section class="tile days" id="s-days"><h2 id="h-days"></h2><div class="grid" id="grid"></div><p id="legend" style="margin-top:12px;font-size:.82rem;color:var(--mut)"></p></section>
<section class="tile pomo" id="s-pomo"><h2 id="h-pomo"></h2>
 <span id="pmode" class="tag"></span><div class="clock" id="clk">45:00</div><select id="pg" style="width:100%;margin-bottom:12px"></select>
 <div class="row" style="margin-bottom:12px"><button class="p" onclick="pStart()" id="pgo"></button><button onclick="pPause()" id="ppa"></button><button onclick="pReset()" id="pre"></button></div>
 <div class="row" style="margin-bottom:12px"><label style="margin:0" id="lmin"></label><input type="number" id="pmin" min="1" max="180" value="45" style="width:84px" onchange="pSet(this.value)"><button onclick="pSet(25)">25</button><button onclick="pSet(45)">45</button><button onclick="pSet(60)">60</button></div>
 <span id="pdone" class="tag"></span>
</section>
<section class="tile today" id="s-today"><h2 id="h-today"></h2><div id="tops"></div><div id="today"></div></section>
<section class="tile danger" id="s-danger"><h2 id="h-danger"></h2><div id="danger"></div></section>
<section class="tile week"><h2 id="h-week"></h2><div class="wk" id="week"></div></section>
<section class="tile note"><h2 id="h-note"></h2><div id="note"></div></section>
<section class="tile prog" id="s-goals"><h2 id="h-prog"></h2><div id="prog"></div></section>
<section class="tile manage" id="s-manage"><h2 id="h-manage"></h2><div class="row" style="margin-bottom:12px"><button class="p" onclick="openGoal()" id="bgoal"></button></div><div id="gl"></div>
 <h3 id="h-habit" style="margin:18px 0 10px"></h3>
 <div class="row"><select id="hg"></select><input type="text" id="hn" style="flex:1;min-width:160px" onkeydown="if(event.key==='Enter')addHabit()"><button class="p" onclick="addHabit()" id="bhab"></button></div>
 <div class="row" id="dpick" style="margin-top:10px"></div>
 <div id="hl" style="margin-top:12px"></div>
</section>
<section class="tile heat" id="s-heat"><h2 id="h-heat"></h2><div id="heat"></div></section>
<section class="tile review" id="s-review"><h2 id="h-review"></h2><div id="review"></div></section>
<section class="tile rewards" id="s-rewards"><h2 id="h-rewards"></h2>
 <div class="row"><input type="text" id="rwt" style="flex:1;min-width:140px"><input type="number" id="rwn" min="1" max="100" style="width:90px"><button class="p" id="rwb" onclick="addReward()"></button></div>
 <div id="rwl" style="margin-top:10px"></div></section>
<section class="tile share" id="s-share"><h2 id="h-share"></h2>
 <div class="row" style="align-items:flex-start;gap:20px">
  <canvas id="cv" width="1080" height="1920"></canvas>
  <div class="row" style="flex:1;min-width:180px;flex-direction:column;align-items:stretch">
   <button class="kb" id="bk1" onclick="setKind('story')"></button>
   <button class="kb" id="bk2" onclick="setKind('sum')"></button>
   <button id="bsh" onclick="msgI++;drawShare()"></button>
   <button id="bpal" onclick="pal=1-pal;drawShare()"></button>
   <button class="p" id="bshare" onclick="shareImg()"></button>
  </div>
 </div>
</section>
<section class="tile rem" id="s-rem"><h2 id="h-rem"></h2>
 <label class="row" style="margin:0;cursor:pointer"><input type="checkbox" id="remon" onchange="remSet()" style="width:20px;height:20px"><span id="lremon"></span></label>
 <div class="row" style="margin:12px 0"><input type="time" id="remtime" onchange="remSet()"></div>
 <div class="row" style="margin-bottom:12px"><label id="lcut" style="margin:0"></label><select id="cutsel" onchange="setCut(this.value)"></select></div><div class="row" style="margin-bottom:12px"><label id="lfmax" style="margin:0"></label><select id="fmaxsel" onchange="S.fmax=+this.value;save();render()"></select></div><button id="rics" onclick="ics()"></button>
 <p id="remnote" style="margin-top:12px;font-size:.85rem;color:var(--mut)"></p>
</section>
<section class="tile vision" id="s-vision"><h2 id="h-vision"></h2><div class="cards" id="vision"></div></section>
</main>
<div id="toast" role="status"></div>
<dialog id="dlg"></dialog>
<script>

 if(wg.length){const g=wg[(sel*7)%wg.length],uc=g.cost&&(!g.why||sel%2===0);h+=`<div class="qt">${uc?'<b>'+t('lose')+'</b> ':''}${esc(uc?g.cost:g.why)}<small class="wh">${g.icon} ${esc(g.title)}</small></div>`}
 h+=`<div class="row" style="margin:10px 0"><span style="color:var(--mut);font-size:.85rem">${t('energy')}</span>${[1,2,3,4,5].map(n=>`<button class="dc ${S.energy[sel]===n?'on':''}" onclick="setEn(${n})">${n}</button>`).join('')}</div>`;
 if(S.energy[sel]&&S.energy[sel]<=2)h+=`<div class="nudge">${t('lowen')}</div>`;
 if(hs.length)h+=`<div class="row" style="margin-bottom:10px"><span style="color:var(--mut);font-size:.85rem">⚑ ${t('nonneg')}</span><select onchange="setFH(this.value)" style="max-width:100%"><option value="">—</option>${hs.map(x=>`<option value="${x.id}" ${S.fh[sel]===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`;
 if(sel<=r){const left=freezeLeft(),fz=S.frz[sel];h+=`<div class="row" style="margin-bottom:12px"><button onclick="togFreeze(${sel})" ${!fz&&left<=0?'disabled':''}>❄ ${fz?t('unfreeze'):t('freeze')}</button><span class="mono" style="font-size:.85rem;color:var(--mut)">${t('frleft')}: ${left}/${S.fmax}</span></div>`}
 $('tops').innerHTML=h}
function renderHeat(){$('h-heat').textContent=t('hheat');const r=real();
 $('heat').innerHTML=S.habits.length?`<div class="hmw">${S.habits.map(h=>{const g=S.goals.find(x=>x.id===h.goalId);let c='';
  for(let d=1;d<=100;d++){const v=chk(d,h.id);let k;if(d>r)k='hl';else if(!due(h,d))k='hr';else if(v===2)k='hm2';else if(v)k='hf';else k='hx';c+=`<i class="${k}" title="${t('day')} ${d}"></i>`}
  return`<div><b>${g?g.icon+' ':''}${esc(h.name)}</b><div class="hm">${c}</div></div>`}).join('')}</div>`:`<div class="empty">${t('empty')}</div>`}
function waShare(w){const s2=weekStats(w),st=streaks(),m=`100 Days · ${t('wk')} ${w}\n${t('wkdone')}: ${Math.round(s2.pct)}%\n${t('perfect')}: ${s2.perfect}\n${t('streak')}: ${st.cur} 🔥`;window.open('https://wa.me/?text='+encodeURIComponent(m),'_blank')}
const idb=(m,v)=>new Promise((ok,no)=>{const r=indexedDB.open('d100db',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>{const tx=r.result.transaction('h',m==='get'?'readonly':'readwrite'),st=tx.objectStore('h'),q=m==='get'?st.get('f'):st.put(v,'f');q.onsuccess=()=>ok(q.result);q.onerror=()=>no()};r.onerror=()=>no()});
function autoWrite(){if(!fsH||fsState!=='on')return;clearTimeout(fsT);fsT=setTimeout(async()=>{try{const w=await fsH.createWritable();await w.write(JSON.stringify(S));await w.close()}catch(e){fsState='perm';renderFs()}},800)}
async function autoPick(){if(!('showSaveFilePicker' in window))return;
 try{if(fsH&&fsState==='perm'&&await fsH.requestPermission({mode:'readwrite'})==='granted'){fsState='on';autoWrite();renderFs();return}
  fsH=await showSaveFilePicker({suggestedName:'100-days-data.json',types:[{description:'JSON',accept:{'application/json':['.json']}}]});await idb('put',fsH);fsState='on';autoWrite();renderFs()}catch(e){}}
async function fsInit(){if(!('showSaveFilePicker' in window))return;try{fsH=await idb('get');if(fsH)fsState=(await fsH.queryPermission({mode:'readwrite'}))==='granted'?'on':'perm'}catch(e){}renderFs()}
function renderFs(){const b=$('bauto');b.hidden=!('showSaveFilePicker' in window);b.textContent=t(fsState==='on'?'autoon':fsState==='perm'?'autore':'auto')}
function selDay(d){sel=d;render()}
function tog(d,h){if(d>real())return;const k=d+':'+h;if(S.checks[k])delete S.checks[k];else{S.checks[k]=1;if(dayPerfect(d))toast(t('allok'))}save();render()}
function renHabit(id){openHabit(id)}
let tt;function toast(m){const e=$('toast');e.textContent=m;e.classList.remove('act');e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),3500)}
function upd(id,k,v){const g=S.goals.find(x=>x.id===id);if(g){g[k]=v;save()}}
function addHabit(){const n=$('hn').value.trim();if(!S.goals.length)return alert(t('nogoal'));if(!n)return;S.habits.push({id:uid(),goalId:$('hg').value,name:n,days:[...addDays]});$('hn').value='';save();render()}
function delHabit(id){snap();S.habits=S.habits.filter(h=>h.id!==id);save();render()}
function delGoal(id){if(!confirm(t('conf')))return;snap();S.goals=S.goals.filter(g=>g.id!==id);S.habits=S.habits.filter(h=>h.goalId!==id);save();render()}
function openGoal(id){const g=S.goals.find(x=>x.id===id)||{};editIcon=g.icon||ICONS[0];editImg=g.img||'';
 $('dlg').innerHTML=`<h3>${t('goal')}</h3><label>${t('title')}</label><input type="text" id="gt" value="${esc(g.title)}"><label>${t('icon')}</label><div class="icons">${ICONS.map(i=>`<button type="button" class="${i===editIcon?'sel':''}" onclick="pick(this,'${i}')">${i}</button>`).join('')}</div><label>${t('why')}</label><textarea id="gw">${esc(g.why)}</textarea><label>${t('cost')}</label><textarea id="gc">${esc(g.cost)}</textarea><label>${t('mtr')}</label><div class="row"><input type="text" id="mn" placeholder="${t('mnph')}" value="${esc(g.metric&&g.metric.name)}" style="flex:2;min-width:120px"><input type="text" id="mu" placeholder="${t('munit')}" value="${esc(g.metric&&g.metric.unit)}" style="flex:1;min-width:70px"></div><div class="row" style="margin-top:8px"><input type="number" step="any" id="ms" placeholder="${t('mstart')}" value="${g.metric?g.metric.start:''}" style="flex:1;min-width:90px"><input type="number" step="any" id="mt" placeholder="${t('mtarget')}" value="${g.metric?g.metric.target:''}" style="flex:1;min-width:90px"></div><label>${t('img')}</label><input type="file" accept="image/*" onchange="readImg(this)"><div class="row" style="margin-top:16px"><button class="p" onclick="saveGoal('${g.id||''}')">${t('save')}</button><button onclick="$('dlg').close()">${t('cancel')}</button></div>`;
 $('dlg').showModal()}
function pick(b,i){editIcon=i;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')}
function readImg(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=640,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);editImg=c.toDataURL('image/jpeg',.72)};im.src=r.result};r.readAsDataURL(f)}
function saveGoal(id){const title=$('gt').value.trim();if(!title)return $('gt').focus();
 const d={icon:editIcon,title,why:$('gw').value,cost:$('gc').value,img:editImg,metric:($('mn').value.trim()&&$('ms').value!==''&&$('mt').value!=='')?{name:$('mn').value.trim(),unit:$('mu').value.trim(),start:+$('ms').value,target:+$('mt').value}:null},g=S.goals.find(x=>x.id===id);
 if(g)Object.assign(g,d);else S.goals.push({id:uid(),...d});save();$('dlg').close();render()}
function exp(){S.lastExport=today();save();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='100-days-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
function imp(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.goals)||!Array.isArray(d.habits))throw 0;S={lang:d.lang||S.lang,start:d.start||today(),goals:d.goals,habits:d.habits.map(h=>({...h,days:h.days||[0,1,2,3,4,5,6]})),checks:d.checks||{},pomos:d.pomos||{},notes:d.notes||{},focus:d.focus||{},theme:d.theme||S.theme,lastExport:d.lastExport,rem:d.rem,cut:(CUT=d.cut||0),metrics:d.metrics||{},reviews:d.reviews||{},rewards:d.rewards||[],rounds:d.rounds||[],frz:d.frz||{},fmax:d.fmax==null?3:d.fmax,energy:d.energy||{},tomorrow:d.tomorrow||{},fh:d.fh||{}};sel=cur();save();render()}catch(e){alert(t('bad'))}inp.value=''};r.readAsText(f)}
function resetAll(){if(confirm(t('conf'))){snap();const l=S.lang;localStorage.removeItem('d100');S=load();S.lang=l;sel=1;save();render()}}
// Pomodoro
let P={min:45,left:2700,run:false,end:0,iv:null,mode:'focus'};
function pDraw(){const m=Math.floor(P.left/60),sc=P.left%60,c=String(m).padStart(2,'0')+':'+String(sc).padStart(2,'0');$('clk').textContent=c;$('pmode').textContent=t(P.mode==='focus'?'focusm':'breakm');$('pdone').textContent=`${t('sess')}: ${S.pomos[today()]||0}`;if(P.run)document.title=c+' · 100 Days'}
function pSet(v){v=Math.min(180,Math.max(1,+v||45));P.min=v;$('pmin').value=v;pPause();P.mode='focus';P.left=v*60;pDraw()}
function pStart(){if(P.run||P.left<=0)return;P.run=true;P.end=Date.now()+P.left*1000;P.iv=setInterval(()=>{P.left=Math.max(0,Math.round((P.end-Date.now())/1000));pDraw();if(P.left<=0)pEnd()},250)}
function pPause(){P.run=false;clearInterval(P.iv);document.title='100 Days'}
function pReset(){pPause();P.left=(P.mode==='focus'?P.min:5)*60;pDraw()}
function pEnd(){pPause();const f=P.mode==='focus';if(f){S.pomos[today()]=(S.pomos[today()]||0)+1;const k=$('pg').value||'_';S.focus[k]=(S.focus[k]||0)+P.min;save()}
 P.mode=f?'break':'focus';P.left=(f?5:P.min)*60;
 try{const c=new AudioContext();[0,.3,.6].forEach(x=>{const o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start(c.currentTime+x);o.stop(c.currentTime+x+.2)})}catch(e){}
 navigator.vibrate&&navigator.vibrate([300,100,300]);toast(t(f?'fin1':'fin2'));render()}
setInterval(remTick,20000);
sel=cur();render();fsInit();
</script>
</body>
